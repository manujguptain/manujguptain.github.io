<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="6" fill="#2e2e33"/>

  <!-- Lowercase "mg" — slightly left-of-centre to balance with the dot -->
  <text
    x="14"
    y="21"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="15"
    font-weight="500"
    fill="#e8e8e9"
    letter-spacing="-0.3"
  >mg</text>

  <!-- Amber spark / accent dot — upper right, like a guiding star -->
  <circle cx="26" cy="8" r="3" fill="#E8A838"/>
</svg>
