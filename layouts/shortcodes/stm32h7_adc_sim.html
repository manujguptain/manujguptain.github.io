<div id="adc-simulator-container" style="font-family: 'Segoe UI', sans-serif; padding: 25px; background: #fff; border: 1px solid #ddd; border-radius: 12px; color: #333; max-width: 850px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h3 style="margin-top:0; color:#1a1a1a; border-bottom: 2px solid #007bff; padding-bottom: 10px;">STM32H7 Metrology Lab: FFT & Delta Error</h3>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <div>
                <label style="font-size: 0.8em; font-weight: bold; color: #666;">Target Accuracy Class</label>
                <select id="target-class" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc;">
                    <option value="0.002">Class 0.2 (Utility)</option>
                    <option value="0.005" selected>Class 0.5 (Industrial)</option>
                    <option value="0.01">Class 1.0 (Residential)</option>
                </select>
            </div>
            <div>
                <label style="font-size: 0.8em; font-weight: bold; color: #666;">Sample Rate: <span id="fs-val" style="color:#007bff">4000</span> Hz</label>
                <input type="range" id="fs-slider" min="100" max="25000" value="4000" style="width:100%">
                <div id="aliasing-warning" style="font-size: 0.7em; color: #d9534f; margin-top: 4px; display: none; font-weight: bold;">⚠️ METROLOGICAL GUARDRAIL: Below 10x oversampling.</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px; padding-left: 15px; border-left: 1px solid #eee;">
            <div>
                <label style="font-size: 0.8em; font-weight: bold; color: #666;">THD: <span id="thd-val" style="color:#e67e22">5</span>%</label>
                <input type="range" id="thd-slider" min="0" max="40" value="5" style="width:100%">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="download-btn" style="flex: 1; background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Export CSV</button>
                <div id="dma-status" style="flex: 1; padding: 10px; border-radius: 4px; font-size: 0.7em; font-weight: bold; text-align: center; background: #eee;">DMA: READY</div>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div style="background: #fdfdfd; border: 1px solid #eee; border-radius: 4px; position: relative; height: 180px;">
            <div style="position: absolute; top: 5px; left: 10px; font-size: 10px; font-weight: bold; color: #666;">WAVEFORM (1024-SAMPLE DMA)</div>
            <svg id="adcSvgChart" viewBox="0 0 400 180" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">
                <path id="path-ideal" d="" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" />
                <path id="path-aliased" d="" fill="none" stroke="#007bff" stroke-width="1.5" />
            </svg>
        </div>
        <div style="background: #fdfdfd; border: 1px solid #eee; border-radius: 4px; position: relative; height: 180px;">
            <div style="position: absolute; top: 5px; left: 10px; font-size: 10px; font-weight: bold; color: #666;">SPECTRUM (256-BIN WINDOW)</div>
            <svg id="fftSvgChart" viewBox="0 0 400 180" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">
                <g id="fft-bars"></g>
            </svg>
        </div>
    </div>
    
    <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
        <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 0.65em; color: #6c757d;">TRUE RMS ERROR</div>
            <div id="error-display" style="font-size: 1.1em; font-weight: bold;">0.00%</div>
        </div>
        <div style="padding: 12px; background: #fffbe6; border-radius: 8px; text-align: center; border: 1px solid #ffe58f;">
            <div style="font-size: 0.65em; color: #856404;">DELTA ERROR (V)</div>
            <div id="delta-display" style="font-size: 1.1em; font-weight: bold; color: #856404;">0.000V</div>
        </div>
        <div id="compliance-status" style="padding: 12px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; font-weight: bold; border: 1px solid #eee;">
            <span id="status-text">INIT</span>
        </div>
    </div>
</div>

<script>
(function() {
    const fsSlider = document.getElementById('fs-slider'), thdSlider = document.getElementById('thd-slider');
    const fsVal = document.getElementById('fs-val'), thdVal = document.getElementById('thd-val');
    const targetClassSel = document.getElementById('target-class');
    const errorDisplay = document.getElementById('error-display'), deltaDisplay = document.getElementById('delta-display');
    const statusText = document.getElementById('status-text'), complianceStatus = document.getElementById('compliance-status');
    const pathAliased = document.getElementById('path-aliased'), pathIdeal = document.getElementById('path-ideal');
    const fftBars = document.getElementById('fft-bars');

    const RESOLUTION = 65535, V_REF = 3.3, BUFFER_SIZE = 1024, FFT_WINDOW = 256; 

    function getGaussianNoise(sigma) {
        let u = Math.random(), v = Math.random();
        return sigma * Math.sqrt(-2.0 * Math.log(u || 0.001)) * Math.cos(2.0 * Math.PI * v);
    }

    function getAliasedFreq(f, fs) {
        let n = fs / 2, freq = f % fs;
        return freq > n ? Math.abs(fs - freq) : freq;
    }

    // Optimization: Fast DFT on 256-sample window
    function calculateFastDFT(samples) {
        let n = samples.length;
        let magnitudes = new Float32Array(n / 2);
        for (let k = 0; k < n / 2; k++) {
            let real = 0, imag = 0;
            for (let t = 0; t < n; t++) {
                let angle = (6.283185 * k * t) / n; // 2 * PI
                real += samples[t] * Math.cos(angle);
                imag -= samples[t] * Math.sin(angle);
            }
            magnitudes[k] = Math.sqrt(real * real + imag * imag) / (n / 2);
        }
        return magnitudes;
    }

    function update() {
        let fs = parseInt(fsSlider.value), thd = parseInt(thdSlider.value) / 100;
        fsVal.innerText = fs; thdVal.innerText = (thd * 100).toFixed(0);
        
        let currentBuffer = [], fftWindowBuffer = [];
        let trueSqSum = 0, dmaSqSum = 0;
        const harmonics = [{f:50, a:1.1}, {f:150, a:1.1*thd*0.7}, {f:250, a:1.1*thd*0.3}];

        let dAliased = "", dIdeal = "";

        for (let i = 0; i < BUFFER_SIZE; i++) {
            let t = i / fs;
            let sigAlias = 1.65; harmonics.forEach(h => sigAlias += h.a * Math.sin(6.283185 * getAliasedFreq(h.f, fs) * t));
            let sigIdeal = 1.65; harmonics.forEach(h => sigIdeal += h.a * Math.sin(6.283185 * h.f * t));

            let v = sigAlias + getGaussianNoise(0.0008);
            let inl = (2.5 / RESOLUTION) * V_REF * Math.sin(6.283185 * (v / V_REF));
            let code = Math.max(0, Math.min(RESOLUTION, Math.round(((v + inl) / V_REF) * RESOLUTION)));
            let measuredV = (code / RESOLUTION) * V_REF;

            currentBuffer.push({t, ideal: sigIdeal, code});
            
            // Collect first 256 samples for FFT processing
            if (i < FFT_WINDOW) {
                fftWindowBuffer.push(measuredV - 1.65);
            }

            // RMS calculation on full 1024-sample DMA buffer
            trueSqSum += Math.pow(sigIdeal - 1.65, 2);
            dmaSqSum += Math.pow(measuredV - 1.65, 2);

            if (i < 100) { 
                let x = i * 4, yA = 180 - ((code / RESOLUTION) * 180), yI = 180 - ((sigIdeal / V_REF) * 180);
                dAliased += (i === 0 ? "M" : "L") + x + "," + yA;
                dIdeal += (i === 0 ? "M" : "L") + x + "," + yI;
            }
        }

        pathAliased.setAttribute("d", dAliased);
        pathIdeal.setAttribute("d", dIdeal);

        // Compute FFT only on the windowed 256 samples
        const mags = calculateFastDFT(fftWindowBuffer);
        let barHtml = "";
        mags.forEach((m, idx) => {
            if (idx > 0 && idx < 64) { // View fundamental + first few harmonics
                let h = Math.min(170, m * 100);
                barHtml += `<rect x="${idx * 6}" y="${180 - h}" width="4" height="${h}" fill="#e67e22" />`;
            }
        });
        fftBars.innerHTML = barHtml;

        const tRms = Math.sqrt(trueSqSum / BUFFER_SIZE), mRms = Math.sqrt(dmaSqSum / BUFFER_SIZE);
        const err = Math.abs((mRms - tRms) / tRms);
        const delta = Math.abs(mRms - tRms);

        errorDisplay.innerText = (err * 100).toFixed(3) + "%";
        deltaDisplay.innerText = delta.toFixed(4) + "V";

        const pass = err <= parseFloat(targetClassSel.value);
        statusText.innerText = pass ? "PASS" : "FAIL";
        complianceStatus.style.background = pass ? "#d4edda" : "#f8d7da";
        complianceStatus.style.color = pass ? "#155724" : "#721c24";
    }

    fsSlider.oninput = update; thdSlider.oninput = update; targetClassSel.onchange = update;
    update();
})();
</script>
